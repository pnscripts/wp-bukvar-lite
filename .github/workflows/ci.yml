name: CI

# Every push to main and every pull request. The plugin ships no Composer
# package; PHPUnit is the only development dependency, resolved fresh on
# every run (no composer.lock) and audited.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # A hung step (network, installer) stops here, not after GitHub's 6 hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 12 needs PHP 8.3; 8.1 and 8.2 are covered by the syntax job.
        php: ['8.3', '8.4']
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: Composer audit
        run: composer audit
      - run: vendor/bin/phpunit

  # The plugin supports PHP 8.1 (Requires PHP), so every shipped file is
  # checked to parse on 8.1 and 8.2.
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find src bukvar-lite.php uninstall.php -name '*.php' -print0 | xargs -0 -n1 php -l
